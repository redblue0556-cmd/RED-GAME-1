<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDGAME</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,600;1,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--red:#ff1a2e;--bg:#050507;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050507}}
:root[data-theme="dark"]{--bg:#050507}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:#fff;font:400 14px/1.4 Manrope,system-ui,sans-serif;min-height:100vh;padding-bottom:130px;background-attachment:fixed;
background-image:linear-gradient(118deg,transparent 30%,rgba(255,26,46,.18) 30.3%,transparent 31.6%),linear-gradient(62deg,transparent 62%,rgba(255,26,46,.13) 62.3%,transparent 63.8%),radial-gradient(ellipse at 0 0,rgba(255,26,46,.38),transparent 45%),radial-gradient(ellipse at 100% 100%,rgba(255,26,46,.3),transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid #ff8a96;outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 14px 12px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:rgba(5,5,7,.92);z-index:29}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;margin:0 auto;max-width:560px;z-index:30;padding:10px 14px;background:linear-gradient(180deg,rgba(16,5,9,.92),rgba(7,7,10,.84));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,40,60,.45);border-top:0;border-radius:0 0 26px 26px;box-shadow:0 12px 34px -12px rgba(255,26,46,.6)}
.hsp{height:146px}
.neon{border:1.5px solid rgba(255,40,60,.8);box-shadow:0 0 14px rgba(255,26,46,.45),inset 0 0 18px rgba(255,26,46,.12);background:linear-gradient(160deg,#1a080c,#09090c)}
.top{display:flex;align-items:center;gap:10px;height:58px;transition:height .3s ease}
header.sc .top{height:40px}
.logo{width:58px;flex:none;filter:drop-shadow(0 0 10px rgba(255,26,46,.6));transition:width .3s ease}
header.sc .logo{width:42px}
.wm{flex:1;min-width:0}
.wm h1{font:italic 800 clamp(25px,7.4vw,36px)/1 'Exo 2',sans-serif;transform:skewX(-4deg);letter-spacing:-.01em;transition:font-size .3s ease}
header.sc .wm h1{font-size:clamp(21px,6vw,27px)}
.wm h1 b{color:var(--red);text-shadow:0 0 18px rgba(255,26,46,.75)}
.wm p{font:italic 600 11px 'Exo 2',sans-serif;letter-spacing:.14em;color:#e5e5ea;margin-top:4px;max-height:16px;overflow:hidden;white-space:nowrap;transition:max-height .3s ease,opacity .3s ease,margin .3s ease}
header.sc .wm p{max-height:0;opacity:0;margin-top:0}
.bell{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);flex:none}
.bell.rg svg{animation:wig .7s ease}
.bell em{position:absolute;top:0;right:0;min-width:20px;height:20px;border-radius:50%;background:var(--red);font:800 11px/20px Manrope;text-align:center;font-style:normal}
.av{position:relative;isolation:isolate;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;flex:none;font:italic 800 17px 'Exo 2';box-shadow:0 0 16px rgba(255,26,46,.7);transition:width .3s,height .3s}
.av::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#ff1a2e,#ffa0aa,#7a0716,#ff1a2e);z-index:-2;animation:spin 5s linear infinite}
.av::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4a1119,#0a0a0d);z-index:-1}
header.sc .av{width:42px;height:42px}
header.sc .bell{width:38px;height:38px}
.cn{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);padding:0 7px;border-radius:99px;background:linear-gradient(180deg,#fde68a,#f59e0b);color:#3b2300;font:800 10px/16px Manrope;box-shadow:0 0 10px rgba(245,158,11,.6);z-index:2;white-space:nowrap}
.cn::before{content:"🪙 "}
.cn.bump{animation:bump .6s ease}
.sr{display:flex;gap:10px;margin:14px 0 0;transition:margin .3s ease}
header.sc .sr{margin-top:8px}
header.sc .fbtn{width:44px;height:44px}
.sbox input{transition:padding .3s ease}
header.sc .sbox input{padding-top:10px;padding-bottom:10px}
.sbox{flex:1;position:relative}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:#cfcfd6}
.sbox input{width:100%;padding:14px 18px 14px 50px;border-radius:99px;background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:15px;border:1.5px solid rgba(255,40,60,.7);box-shadow:0 0 12px rgba(255,26,46,.35)}
.sbox input:focus{outline:0;border-color:#ff5a6a}
.fbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;transition:width .3s,height .3s}
.fbtn svg{width:24px;height:24px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chip{padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.07);color:#b4b4be;font-weight:700;font-size:12px;white-space:nowrap}
.chip.on{background:var(--red);color:#fff;box-shadow:0 0 14px rgba(255,26,46,.5)}
.hero{position:relative;min-height:250px;border-radius:26px;overflow:hidden;background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,7,.88),rgba(5,5,7,.25) 62%,transparent)}
.hin{position:relative;padding:22px 18px 44px;max-width:66%}
.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:8px;background:linear-gradient(90deg,#b80f22,#ff1a2e);font:700 12px Manrope}
.htitle{margin-top:14px;font:italic 800 38px/.95 'Exo 2',sans-serif;text-transform:uppercase;text-shadow:0 0 22px rgba(120,60,255,.8);overflow-wrap:anywhere}
.hsub{font:italic 800 24px/1.1 'Exo 2',sans-serif;text-transform:uppercase;color:#e879f9;text-shadow:0 0 16px rgba(232,121,249,.8)}
.hin p{margin:12px 0 16px;font-size:13px;color:#f0f0f5}
.main{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:14px;background:linear-gradient(180deg,#ff2c40,#d10f24);border:1.5px solid rgba(255,130,140,.7);box-shadow:0 0 18px rgba(255,26,46,.7);font:700 15px Manrope}
.main svg{width:16px;height:16px}
.dots{position:absolute;right:16px;bottom:12px;display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;background:#666;padding:0}
.dots button.on{background:var(--red);box-shadow:0 0 8px var(--red)}
.qt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0 4px}
.q{position:relative;aspect-ratio:1/1.08;border-radius:16px;border:1.5px solid rgba(255,255,255,.16);background:linear-gradient(160deg,#18181d,#0a0a0d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 10px/1.1 Manrope;text-align:center;padding:2px}
.q span{font-size:26px;line-height:1}
.q i{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.sh h3{font:800 21px Manrope;display:flex;align-items:center;gap:8px}
.sh button{color:#ff3b4e;font:600 13px Manrope}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tc{flex:0 0 152px;border-radius:20px;padding:6px 6px 10px}
.tgrid .tc{flex:auto}
.tcv{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/.92;background:#18181f}
.tcv img{width:100%;height:100%;object-fit:cover;display:block}
.no1{position:absolute;top:0;right:0;background:var(--red);padding:3px 10px;border-radius:0 0 0 12px;font:800 12px Manrope}
.tc h4{font:700 14px/1.2 Manrope;margin:9px 4px 5px;min-height:34px}
.tc p{display:flex;justify-content:space-between;margin:0 4px 8px;font-size:12px;color:#c9c9d1}
.tc p b{color:#fff}.st{color:#facc15}
.inst{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:12px;background:linear-gradient(180deg,#ff2c40,#d10f24);border:1px solid rgba(255,120,130,.6);box-shadow:0 0 14px rgba(255,26,46,.5);font:700 13px Manrope}
.inst svg{width:18px;height:18px}
.feat{position:relative;display:grid;grid-template-columns:42% 1fr;border-radius:22px;overflow:hidden;min-height:156px}
.feat>img{width:100%;height:100%;object-fit:cover;display:block}
.fi{padding:14px 14px 58px 16px}
.fi h4{font:800 20px/1.15 Manrope}
.fi .d{font-size:13px;color:#cfcfd6;margin:6px 0}
.fm{font-size:13px}
.gchip{display:inline-flex;gap:6px;padding:4px 10px;border-radius:8px;background:#000;border:1px solid rgba(255,255,255,.2);font:600 12px Manrope;margin-top:8px}
.feat .inst{position:absolute;right:14px;bottom:14px;width:auto;padding:10px 26px;font-size:14px}
.hot{position:absolute;top:0;right:0;background:linear-gradient(90deg,transparent,#e11d2e 35%);padding:4px 14px 4px 30px;font:800 13px Manrope;border-radius:0 0 0 14px}
h2{font:italic 800 24px 'Exo 2',sans-serif;margin-bottom:6px}
.sub{color:#a4a4b0;font-size:13px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;margin-bottom:10px}
.row img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.row .t{flex:1;min-width:0}
.row h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row p{font-size:12px;color:#a4a4b0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:14px;background:linear-gradient(180deg,#ff2c40,#d10f24);font:700 13px Manrope;box-shadow:0 0 14px rgba(255,26,46,.45)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none}
.empty{padding:34px 20px;text-align:center;border-radius:24px;color:#a4a4b0}
.empty .btn{margin-top:14px}
.ach{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;margin-bottom:10px;opacity:.45}
.ach.got{opacity:1}
.ach .i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:20px}
.ach.got .i{background:var(--red);box-shadow:0 0 18px var(--red)}
.fab{position:fixed;right:18px;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#ff1a2e,#ff576b);font:800 30px/1 Manrope;box-shadow:0 8px 28px rgba(255,26,46,.7)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav div{position:relative;pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:560px;padding:7px;border-radius:30px;border:1.5px solid rgba(255,40,60,.6);background:rgba(8,8,10,.95);box-shadow:0 0 18px rgba(255,26,46,.35)}
nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:#c4c4cc;font:600 10.5px Manrope;transition:color .25s}
nav svg{width:27px;height:27px;transition:transform .45s cubic-bezier(.34,1.56,.64,1),fill .25s}
nav button.on{color:#ff3b4e}
nav button.on svg{transform:translateY(-2px) scale(1.14);fill:currentColor}
nav button.k-dl.on svg{fill:none}
.ind{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 22px)/5);border-radius:24px;border:1.5px solid rgba(255,40,60,.9);background:radial-gradient(circle at 50% 20%,rgba(255,26,46,.42),rgba(255,26,46,.07));box-shadow:0 0 18px rgba(255,26,46,.55),inset 0 0 12px rgba(255,26,46,.25);transform:translateX(calc(var(--i,0)*(100% + 2px)));transition:transform .5s cubic-bezier(.34,1.35,.64,1)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:28px;padding:22px}
.bar{display:flex;align-items:center;justify-content:space-between}
label{display:block;font-size:12px;font-weight:700;color:#a4a4b0;margin:14px 0 6px}
.in2{width:100%;padding:11px 14px;border-radius:12px;background:#14141D;border:1px solid rgba(255,255,255,.12);color:#fff;font:inherit;font-size:14px}
.drop{display:block;padding:20px;border:1px dashed rgba(255,30,56,.55);border-radius:16px;text-align:center;color:#a4a4b0;cursor:pointer;margin:0}
.drop input{display:none}
.report{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12px;color:#d4d4dc}
.ok{color:#4ade80}.bad{color:#ff6b7d}
.cov{width:96px;height:96px;border-radius:16px;margin-top:10px;display:block;object-fit:cover}
.player{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#0D0D12;border-bottom:1px solid rgba(255,255,255,.1)}
.player iframe{flex:1;border:0;width:100%;background:#fff}
.btn[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;max-width:90vw;padding:10px 18px;border-radius:99px;background:var(--red);font:700 13px Manrope;box-shadow:0 8px 30px rgba(255,26,46,.5);display:none;text-align:center}
button:active{transform:scale(.95)}
.tc{transition:transform .25s ease,box-shadow .25s ease}
.tc:hover{transform:translateY(-3px);box-shadow:0 0 22px rgba(255,26,46,.6),inset 0 0 18px rgba(255,26,46,.14)}
.pg.goR{animation:inR .45s cubic-bezier(.22,1,.36,1)}
.pg.goL{animation:inL .45s cubic-bezier(.22,1,.36,1)}
.pg.goR>*,.pg.goL>*{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.pg.goR>:nth-child(2),.pg.goL>:nth-child(2){animation-delay:.05s}
.pg.goR>:nth-child(3),.pg.goL>:nth-child(3){animation-delay:.1s}
.pg.goR>:nth-child(4),.pg.goL>:nth-child(4){animation-delay:.15s}
.pg.goR>:nth-child(5),.pg.goL>:nth-child(5){animation-delay:.2s}
.pg.goR>:nth-child(n+6),.pg.goL>:nth-child(n+6){animation-delay:.25s}
.hero.hf{animation:heroIn .55s cubic-bezier(.22,1,.36,1)}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 2.6s ease-out infinite}
.modal.open .sheet{animation:pop .35s cubic-bezier(.22,1,.36,1)}
.player.open{animation:fadeIn .3s ease}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:.15;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,26,46,.55)}70%,100%{box-shadow:0 0 0 18px rgba(255,26,46,0)}}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.4)}100%{transform:translateX(-50%) scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header id="hd">
  <div class="top">
    <svg class="logo" viewBox="0 0 80 66" aria-hidden="true"><path d="M16 16 22 3l9 8 9-10 9 10 9-8 6 13z" fill="#facc15"/><path d="M14 28h52c9 0 15 20 13 31-1 6-9 7-13 2l-7-9H21l-7 9c-4 5-12 4-13-2-2-11 4-31 13-31z" fill="#ff1a2e"/><path d="M26 36v12M20 42h12" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="54" cy="38" r="3.8" fill="#fff"/><circle cx="62" cy="45" r="3.8" fill="#fff"/><circle cx="46" cy="45" r="3.8" fill="#fff"/></svg>
    <div class="wm"><h1>RED<b>GAME</b></h1><p>YOUR WORLD. YOUR GAMES.</p></div>
    <button class="bell" data-q="bell" aria-label="Notifikasi"><svg class="ic" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><em>3</em></button>
    <button class="av" data-tab="PROFILE" aria-label="Profil">RG<span class="cn" id="cn">150</span></button>
  </div>
  <div class="sr">
    <div class="sbox"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="q" placeholder="Cari game favoritmu…" aria-label="Cari game"></div>
    <button class="fbtn neon" data-q="cat" aria-label="Filter genre"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>
<div class="hsp"></div>
<main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Tambah game">+</button>
<nav aria-label="Navigasi utama"><div id="nav"></div></nav>

<div class="modal" id="up"><div class="sheet neon">
  <div class="bar"><h2 style="margin:0;font-size:20px">Tambah game baru</h2><button class="btn ghost" style="padding:6px 12px" id="x">Tutup</button></div>
  <label>File game</label>
  <label class="drop"><span id="dtxt">Pilih file HTML, ZIP HTML5, APK, atau arsip PC</span><input type="file" id="file" accept=".html,.htm,.zip,.apk,.exe,.7z,.rar,.xapk"></label>
  <div class="report" id="rep" hidden></div>
  <label for="lnk">Atau tempel link game web</label><input class="in2" id="lnk" type="url" inputmode="url" placeholder="https://contoh.github.io/game/">
  <p class="sub" style="margin:6px 0 0;font-size:11px">Pakai hanya untuk game yang boleh ditanam di situs lain. Sebagian situs memblokirnya.</p>
  <label for="t">Judul game</label><input class="in2" id="t" placeholder="Contoh: Space Impact Arena">
  <label for="g">Genre</label>
  <select class="in2" id="g"><option>Action</option><option>Racing</option><option>RPG</option><option>Horror</option><option>Arcade</option></select>
  <label>Gambar sampul (opsional)</label>
  <label class="drop"><span id="ctxt">Pilih gambar PNG atau JPG. Kosongkan untuk sampul otomatis</span><input type="file" id="cimg" accept="image/*"></label>
  <img class="cov" id="cov" alt="Pratinjau sampul" hidden>
  <button class="btn" style="width:100%;margin-top:18px" id="save">Simpan game</button>
</div></div>

<div class="player" id="pl"><div class="pbar"><b id="ptitle"></b><div style="display:flex;gap:8px"><a class="btn ghost" style="padding:6px 12px" id="popen" target="_blank" rel="noopener noreferrer" hidden>Tab baru</a><button class="btn ghost" style="padding:6px 12px" id="pfs">Layar penuh</button><button class="btn" style="padding:6px 14px" id="pclose">Keluar</button></div></div><div id="phint" style="display:none;padding:6px 14px;font-size:12px;background:#1a0a0d;color:#ffb4bc">Layar kosong? Banyak situs melarang game-nya ditanam di situs lain. Tekan “Tab baru”.</div></div>
<div class="modal" id="cf"><div class="sheet neon" style="max-width:340px"><h2 id="cft" style="font-size:19px"></h2><p class="sub" id="cfm" style="margin-bottom:18px"></p><div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="cfn">Batal</button><button class="btn" style="flex:1" id="cfy">Hapus</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};

var db=null;
function openDB(){return new Promise(function(res){try{var r=indexedDB.open('redgame',1);r.onupgradeneeded=function(){r.result.createObjectStore('games',{keyPath:'id'})};r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}

/* Inspektor ZIP (proteksi ZIP-Slip) */
function unsafePath(n){if(/^[\\\/]/.test(n)||/^[a-zA-Z]:/.test(n)||n.indexOf('\\')>-1||n.indexOf('\0')>-1)return true;return n.split('/').some(function(p){return p==='..'})}
function inspectZip(zip){var bad=[],safe=[];Object.keys(zip.files).forEach(function(n){if(unsafePath(n)){bad.push(n);return}if(!zip.files[n].dir)safe.push(n)});
var idx=safe.filter(function(n){return /(^|\/)index\.html?$/i.test(n)}).sort(function(a,b){return a.split('/').length-b.split('/').length})[0]||null;return {bad:bad,safe:safe,entry:idx}}

/* Upload */
function reset(){st.pend=null;st.pc=null;$('lnk').value='';['file','cimg'].forEach(function(i){$(i).value=''});$('rep').hidden=true;$('cov').hidden=true;$('t').value='';$('dtxt').textContent='Pilih file HTML, ZIP HTML5, APK, atau arsip PC';$('ctxt').textContent='Pilih gambar PNG atau JPG. Kosongkan untuk sampul otomatis'}
function preview(){if(st.pc)return;var t=$('t').value||'RG',m=D.filter(function(d){return match(t,d.title)})[0]||{};$('cov').src=draw(t,m.emoji,m.hue!=null?m.hue:hue(t),0);$('cov').hidden=false}
$('file').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;
  var ext=(f.name.split('.').pop()||'').toLowerCase(),rep=$('rep');rep.hidden=false;$('dtxt').textContent=f.name;
  if(!$('t').value)$('t').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  var done=function(p){st.pend=p;preview()};
  if(ext==='html'||ext==='htm'){
    rep.innerHTML='<span class="ok">Diterima.</span> File HTML tunggal, bisa langsung dimainkan di browser ('+sz(f)+').';
    done({blob:f,platform:'Browser',playable:true,entry:'single',size:f.size});
  }else if(ext==='zip'){
    rep.textContent='Memeriksa paket…';
    JSZip.loadAsync(f).then(function(zip){
      var r=inspectZip(zip);
      if(r.bad.length){rep.innerHTML='<span class="bad">Ditolak: '+r.bad.length+' jalur berbahaya (path traversal), contoh <code>'+esc(r.bad[0])+'</code>.</span>';st.pend=null;return}
      if(r.entry){rep.innerHTML='<span class="ok">Aman.</span> '+r.safe.length+' file, titik masuk <code>'+esc(r.entry)+'</code>. Game bisa dimainkan di browser.';done({blob:f,platform:'Browser',playable:true,entry:r.entry,size:f.size})}
      else{rep.innerHTML='<span class="ok">Aman</span>, tetapi tidak ada <code>index.html</code>. Ini kemungkinan kode sumber yang harus di-build dulu, jadi disimpan sebagai arsip PC untuk diunduh.';done({blob:f,platform:'PC',playable:false,size:f.size})}
    }).catch(function(){rep.innerHTML='<span class="bad">File ZIP rusak atau tidak bisa dibaca.</span>';st.pend=null});
  }else{
    var apk=ext==='apk'||ext==='xapk';
    rep.innerHTML='<span class="ok">Diterima.</span> '+(apk?'Paket Android, tersedia untuk diunduh dan dipasang.':'Arsip PC, tersedia untuk diunduh.');
    done({blob:f,platform:apk?'Android':'PC',playable:false,size:f.size});
  }
});

function saveLink(t,lk){
  var u;try{u=new URL(lk)}catch(e){toast('Link tidak valid');return}
  if(u.protocol!=='https:'){toast('Gunakan link yang diawali https://');return}
  t=t||u.hostname.replace(/^www\./,'');var hh=hue(t);
  var g={id:String(Date.now()),title:t,genre:$('g').value,platform:'Web',size:0,version:'Web',hue:hh,cover:st.pc?st.pc.cover:draw(t,null,hh,0),banner:st.pc?st.pc.banner:draw(t,null,hh,1),playable:true,entry:'link',link:u.href,blob:null,plays:0};
  st.games.unshift(g);st.hi=0;st.coins+=30;dbPut(g).then(function(){toast('Link ditambahkan · +30 coins')});
  $('up').classList.remove('open');reset();render();
}
$('save').addEventListener('click',function(){
  var t=$('t').value.trim();

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab],[data-genre],[data-act],[data-q],[data-hi]');if(!el)return;
  var d=el.dataset;
  if(d.tab){if(d.tab!==st.tab){var ks=TABS.map(function(t){return t[0]});st.anim=ks.indexOf(d.tab)>ks.indexOf(st.tab)?'goR':'goL';st.tab=d.tab;window.scrollTo(0,0)}render();return}

    if(d.q==='add')$('up').classList.add('open');
    else if(d.q==='cat'){st.tab='HOME';st.filt=!st.filt;render()}
    else if(d.q==='daily'){if(st.daily)toast('Reward hari ini sudah diklaim');else{st.daily=true;st.coins+=20;toast('+20 coins dari daily reward');render()}}
    else if(d.q==='bell'){el.classList.remove('rg');void el.offsetWidth;el.classList.add('rg');toast('3 notifikasi: promo, daily reward, dan update game')}

  }
